# Open Cowork stack for Portainer, using the published image.
#
# Portainer › Stacks › Add stack, then either paste this file into the Web editor or
# choose "Repository" with this file as the compose path. Override any ${VARIABLE}
# below in the stack's "Environment variables" section.
#
# Updating: open the stack, click "Update the stack" and choose to re-pull the image.
# The container is replaced; your data in the open-cowork-data volume is kept and the
# database is upgraded automatically on startup.
services:
  open-cowork:
    image: ghcr.io/cametendo/open-cowork:${OPEN_COWORK_TAG:-latest}
    container_name: open-cowork
    ports:
      - "${OPEN_COWORK_PORT:-3000}:8080"
    environment:
      # Initial connections (first boot only — change them later in Admin › Connections)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Leave empty to generate one automatically (stored in the data volume)
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - WEBUI_NAME=${WEBUI_NAME:-Open Cowork}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-pending}
      - COWORK_ALLOW_SHELL=${COWORK_ALLOW_SHELL:-true}
    volumes:
      # Accounts, chats, tasks, settings and the secret key
      - open-cowork-data:/app/backend/data
      # Absolute host paths: Portainer resolves relative paths against its own stack folder
      - ${OPEN_COWORK_HOST_DIR:-/opt/open-cowork}/repo:/repo
      - ${OPEN_COWORK_HOST_DIR:-/opt/open-cowork}/workspaces:/workspaces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  open-cowork-data:
    # Fixed name, so it doesn't depend on what the stack is called
    name: open-cowork-data
