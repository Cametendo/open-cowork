# Run Ollama in a container next to Open Cowork (Linux):
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#   docker compose exec ollama ollama pull qwen3:8b
#
# Don't use this if Ollama is already installed on the machine; both want port 11434.
# NVIDIA GPU: install the NVIDIA Container Toolkit and uncomment the deploy block.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # Same network as Open Cowork; only reachable from this machine
    network_mode: host
    environment:
      - OLLAMA_HOST=127.0.0.1:11434
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  open-cowork:
    depends_on:
      - ollama

volumes:
  ollama:
