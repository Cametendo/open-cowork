[project]
name = "open-cowork"
version = "0.1.0"
description = "Self-hosted chat + agentic Cowork UI for Ollama and OpenAI-compatible APIs"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "pyjwt>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "cryptography>=42",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
open-cowork = "open_cowork.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["open_cowork*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
