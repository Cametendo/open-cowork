# Alembic CLI config — only needed to create new migrations during development.
# The app applies migrations itself on startup (open_cowork/migrate.py).
#
# After changing models.py:
#   .venv/bin/alembic revision --autogenerate --rev-id 0002 -m "describe the change"
# then review the generated file in open_cowork/migrations/versions/.
# The database it compares against comes from DATA_DIR / DATABASE_URL.

[alembic]
script_location = open_cowork/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
